<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Chat</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f3f5f9; --text: #1b2130; --muted: #6b7385;
    --border: #dfe3ec; --accent: #1e3a8a; --user: #e8edf7; --code: #eef1f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a26; --panel: #101420; --text: #e6e9f2; --muted: #8e97ab;
      --border: #283048; --accent: #3b64c4; --user: #1f2740; --code: #0d111b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 290px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  #sidebar .top { padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
  #newChat {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 12px; cursor: pointer; font-weight: 600;
  }
  #newChat:hover { filter: brightness(1.08); }
  #search {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #chatList { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .group-label { font-size: 12px; color: var(--muted); padding: 12px 8px 4px; text-transform: uppercase; letter-spacing: .04em; }
  .chat-item {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  .chat-item:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
  .chat-item.active { background: color-mix(in srgb, var(--text) 12%, transparent); }
  .ci-main { flex: 1; min-width: 0; }
  .ci-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ci-snip { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ci-snip mark, .ci-title mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 2px; }
  .ci-del {
    visibility: hidden; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px;
  }
  .chat-item:hover .ci-del { visibility: visible; }
  .ci-del:hover { color: #d33; background: color-mix(in srgb, #d33 15%, transparent); }
  .empty-list { color: var(--muted); padding: 16px 10px; font-size: 14px; }

  /* ---------- Main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 18px;
    border-bottom: 1px solid var(--border);
  }
  #title {
    flex: 1 1 140px; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: text;
  }
  #title:hover { text-decoration: underline dotted; }
  select, .btn {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; cursor: pointer;
  }
  select { max-width: 260px; }
  .btn:hover, select:hover { border-color: var(--muted); }
  #sysWrap { display: none; padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #sysWrap.open { display: block; }
  #sysWrap label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  #sysPrompt {
    width: 100%; min-height: 60px; resize: vertical; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
  }
  #banner {
    display: none; background: color-mix(in srgb, #d33 14%, var(--bg)); color: var(--text);
    padding: 8px 18px; font-size: 14px; border-bottom: 1px solid var(--border);
  }
  #banner.show { display: block; }

  #messages { flex: 1; overflow-y: auto; padding: 24px 18px 8px; scroll-behavior: auto; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin: 0 0 22px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--user); padding: 9px 14px; border-radius: 14px; max-width: 85%;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.assistant .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg.assistant .body { word-wrap: break-word; overflow-wrap: anywhere; }
  .body > :first-child { margin-top: 0; }
  .body > :last-child { margin-bottom: 0; }
  .body p, .body ul, .body ol, .body pre, .body blockquote, .body table { margin: 0 0 12px; }
  .body pre {
    position: relative; background: var(--code); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
  }
  .body code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
  .body :not(pre) > code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
  .body blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--muted); }
  .body table { border-collapse: collapse; }
  .body th, .body td { border: 1px solid var(--border); padding: 4px 10px; }
  .copy {
    position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); border-radius: 6px; color: var(--muted);
  }
  .err { color: #d33; margin-top: 6px; font-size: 14px; }
  .dots::after { content: "…"; animation: blink 1s infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: .2; } }
  .hero { text-align: center; margin-top: 18vh; color: var(--muted); }
  .hero h1 { color: var(--text); font-weight: 500; font-size: 28px; margin: 0 0 8px; }

  /* ---------- Composer ---------- */
  #composer { padding: 10px 18px 18px; }
  .box {
    max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    border: 1px solid var(--border); border-radius: 14px; padding: 8px 8px 8px 14px; background: var(--bg);
  }
  .box:focus-within { border-color: var(--accent); }
  #input {
    flex: 1; border: 0; outline: none; resize: none; background: transparent;
    max-height: 220px; padding: 6px 0; line-height: 1.5;
  }
  #send {
    border: 0; background: var(--accent); color: #fff; border-radius: 10px;
    padding: 8px 14px; cursor: pointer; font-weight: 600;
  }
  #send.stop { background: #555; }
  #send:disabled { opacity: .4; cursor: default; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* ---------- Model manager ---------- */
  .side-foot { padding: 10px 12px; border-top: 1px solid var(--border); }
  .side-foot .btn { width: 100%; }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); border-color: transparent; }
  .btn.sm { padding: 3px 10px; font-size: 13px; }
  .btn.danger:hover { color: #d33; border-color: #d33; }
  dialog {
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 14px;
    padding: 0; width: min(760px, 94vw); max-height: 86vh;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  .dlg-in { padding: 18px 20px 20px; max-height: 86vh; overflow-y: auto; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .dlg-head strong { font-size: 17px; }
  .pull { display: flex; gap: 8px; }
  #pullName {
    flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); outline: none;
  }
  #pullName:focus { border-color: var(--accent); }
  #pullStatus { margin-top: 10px; }
  .pbar { height: 8px; border-radius: 99px; background: var(--user); overflow: hidden; }
  #pbarFill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #pullText { font-size: 13px; color: var(--muted); margin-top: 6px; }
  #pullText.bad { color: #d33; }
  #modelTable { margin-top: 16px; }
  #modelTable table { width: 100%; border-collapse: collapse; }
  #modelTable th, #modelTable td { padding: 9px 6px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
  #modelTable th { color: var(--muted); font-weight: 500; font-size: 12px; }
  #modelTable td.act { text-align: right; white-space: nowrap; }
  #modelTable td.act .btn { margin-left: 6px; }
  .mname { font-weight: 600; word-break: break-all; }
  .badge {
    font-size: 11px; padding: 1px 8px; border-radius: 99px; margin-left: 8px; font-weight: 500;
    background: color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .dlg-note { margin-top: 14px; font-size: 12px; color: var(--muted); }
  .browse { display: flex; gap: 8px; margin-bottom: 10px; }
  .browse select { flex: 1; min-width: 0; max-width: none; }
  .browse select:disabled { opacity: .6; cursor: default; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .filters select { max-width: none; }
  #libSearch {
    flex: 1 1 150px; min-width: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); outline: none;
  }
  #libSearch:focus { border-color: var(--accent); }
  .filters :disabled { opacity: .6; cursor: default; }
  #libNote { margin: -4px 0 10px; }
  #libNote:empty { display: none; }

  /* ---------- Context + reasoning ---------- */
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .chk[hidden], #ctxSel[hidden] { display: none; }
  .chk input { accent-color: var(--accent); cursor: pointer; }
  #ctxSel { max-width: 250px; font-size: 13px; }
  .think { margin: 0 0 12px; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); font-size: 13.5px; }
  .think summary { cursor: pointer; user-select: none; }
  .think summary:hover { color: var(--text); }
  .think-body { white-space: pre-wrap; max-height: 260px; overflow-y: auto; margin-top: 6px; line-height: 1.5; }
  .think:not([open]) .think-body { display: none; }

  @media (max-width: 720px) { #sidebar { display: none; } }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="top">
    <button id="newChat">+ New chat</button>
    <input id="search" type="search" placeholder="Search chats…" autocomplete="off">
  </div>
  <div id="chatList"></div>
  <div class="side-foot"><button class="btn" id="modelsBtn">Manage models</button></div>
</aside>

<section id="main">
  <header>
    <div id="title" title="Click to rename">New chat</div>
    <label class="chk" id="thinkWrap" hidden title="Let the model reason before it answers. Slower, often better; the reasoning counts towards the context size."><input type="checkbox" id="thinkChk" checked> Thinking</label>
    <select id="ctxSel" hidden title="Context window: how much of the conversation the model can see at once. Bigger needs more memory (estimate shown). Auto picks a size that suits the model."></select>
    <button class="btn" id="sysToggle" title="Set a system prompt for this chat">System prompt</button>
    <select id="modelSel" title="Model for the next message"></select>
  </header>
  <div id="sysWrap">
    <label for="sysPrompt">System prompt (applies to this chat)</label>
    <textarea id="sysPrompt" placeholder="e.g. You are a concise assistant that answers in German."></textarea>
  </div>
  <div id="banner"></div>
  <div id="messages"><div class="wrap" id="msgWrap"></div></div>
  <div id="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Message your local model…"></textarea>
      <button id="send">Send</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>
</section>

<dialog id="modelsDlg">
  <div class="dlg-in">
    <div class="dlg-head"><strong>Models</strong><button class="btn sm" id="dlgClose">Close</button></div>
    <div class="filters">
      <input id="libSearch" type="search" placeholder="Filter by name..." autocomplete="off" disabled>
      <select id="libCap" disabled title="Only models with this capability"><option value="">Any capability</option></select>
      <select id="libSize" disabled title="Only models that have a variant up to this many parameters (billions)">
        <option value="">Any size</option><option value="2">up to 2B</option><option value="4">up to 4B</option>
        <option value="8">up to 8B</option><option value="14">up to 14B</option><option value="32">up to 32B</option>
      </select>
      <select id="libSort" disabled title="Sort order">
        <option value="popular">Most popular</option><option value="az">A - Z</option>
        <option value="small">Smallest variant first</option><option value="large">Largest variant first</option>
      </select>
    </div>
    <div class="browse">
      <select id="libModel" disabled title="Models available on ollama.com (parameter counts shown)"><option value="">Loading model library...</option></select>
      <select id="libTag" disabled title="Variants of the chosen model, with download size"><option value="">Variant</option></select>
    </div>
    <div class="dlg-note" id="libNote"></div>
    <div class="pull">
      <input id="pullName" placeholder="Download a model, e.g. llama3.2 or qwen2.5:7b" autocomplete="off" spellcheck="false">
      <button class="btn primary" id="pullBtn">Download</button>
    </div>
    <div id="pullStatus" hidden>
      <div class="pbar"><div id="pbarFill"></div></div>
      <div id="pullText"></div>
    </div>
    <div id="modelTable"></div>
    <div class="dlg-note">The list of downloadable models comes from ollama.com (needs internet); sizes are download sizes. You can always type a name by hand. A cancelled download resumes where it stopped.</div>
  </div>
</dialog>

<!-- Markdown rendering. If you're offline these fail to load and replies show as plain text. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

const state = {
  chats: [],          // sidebar list
  chat: null,         // {id|null, title, model, system_prompt, messages[]}
  models: [],
  busy: false,
  ctrl: null,
  query: '',
};

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).error || msg; }
    catch { if (r.status === 404) msg = 'The server does not know this feature yet: put the newest app.py in the project folder and restart the tool (close the console window, start it again).'; }
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
}

function showBanner(msg) {
  const b = $('#banner');
  b.textContent = msg || '';
  b.classList.toggle('show', !!msg);
}

/* ---------------- Markdown ---------------- */
function renderMd(text) {
  if (window.marked && window.DOMPurify) {
    return DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  }
  return '<p style="white-space:pre-wrap">' + esc(text) + '</p>';
}
function addCopyButtons(root) {
  root.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy')) return;
    const b = document.createElement('button');
    b.className = 'copy'; b.textContent = 'Copy';
    b.onclick = async () => {
      await navigator.clipboard.writeText(pre.innerText.replace(/Copy$/, '').trimEnd());
      b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200);
    };
    pre.appendChild(b);
  });
}

/* ---------------- Messages ---------------- */
function buildMessage(m) {
  const el = document.createElement('div');
  el.className = 'msg ' + m.role;
  if (m.role === 'user') {
    el.innerHTML = '<div class="bubble"></div>';
    $('.bubble', el).textContent = m.content;
  } else {
    el.innerHTML = '<div class="who"></div><details class="think" hidden><summary></summary><div class="think-body"></div></details>' +
      '<div class="body"></div><div class="err"></div>';
    $('.who', el).textContent = m.model || '';
    $('.think summary', el).addEventListener('click', () => { $('.think', el).dataset.touched = '1'; });  // you decide from now on
    fillAssistant(el, m);
  }
  return el;
}
function fmtDur(ms) {
  const s = Math.max(1, Math.round(ms / 1000));
  return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + (s % 60) + ' s';
}

function fillAssistant(el, m) {
  const body = $('.body', el), det = $('.think', el);
  const waiting = state.busy && !m.content && !m.error;        // still waiting for the answer to start
  if (m.thinking) {
    det.hidden = false;
    const tb = $('.think-body', det);
    tb.textContent = m.thinking;
    $('summary', det).textContent = waiting ? 'Thinking…' : (m.think_ms != null ? 'Thought for ' + fmtDur(m.think_ms) : 'Reasoning');
    if (!det.dataset.touched) det.open = waiting;              // open while thinking, fold away once the answer starts
    if (waiting) tb.scrollTop = tb.scrollHeight;
  } else { det.hidden = true; }
  if (m.content) { body.classList.remove('dots'); body.innerHTML = renderMd(m.content); addCopyButtons(body); }
  else if (waiting && !m.thinking) { body.innerHTML = ''; body.classList.add('dots'); }
  else { body.innerHTML = ''; body.classList.remove('dots'); }
  $('.err', el).textContent = m.error || '';
}

function nearBottom() {
  const s = $('#messages');
  return s.scrollHeight - s.scrollTop - s.clientHeight < 120;
}
function scrollBottom() { const s = $('#messages'); s.scrollTop = s.scrollHeight; }

function renderMessages() {
  const wrap = $('#msgWrap');
  wrap.innerHTML = '';
  const chat = state.chat;
  if (!chat.messages.length) {
    wrap.innerHTML = `<div class="hero"><h1>What's on your mind?</h1><div>Chatting with ${esc($('#modelSel').value || 'a local model')}</div></div>`;
    return;
  }
  for (const m of chat.messages) wrap.appendChild(buildMessage(m));
  scrollBottom();
}

function renderHeader() {
  $('#title').textContent = state.chat.title || 'New chat';
  $('#sysPrompt').value = state.chat.system_prompt || '';
  syncModelSelect();
}

function syncModelSelect() {
  const sel = $('#modelSel');
  const want = state.chat.model || localStorage.getItem('lastModel') || state.models[0] || '';
  const names = [...state.models];
  if (want && !names.includes(want)) names.push(want);
  sel.innerHTML = names.map(n => `<option value="${esc(n)}">${esc(n)}${state.models.includes(n) ? '' : ' (not installed)'}</option>`).join('');
  if (want) sel.value = want;
  updateContextControls();
}

/* ---------------- Sidebar ---------------- */
function groupLabel(ts) {
  const d = new Date(ts * 1000), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  if (diff <= 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return 'Previous 7 days';
  if (diff < 30) return 'Previous 30 days';
  return 'Older';
}
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  return safe.replace(new RegExp(escRe(esc(q)), 'gi'), m => `<mark>${m}</mark>`);
}

function renderSidebar() {
  const list = $('#chatList');
  list.innerHTML = '';
  if (!state.chats.length) {
    list.innerHTML = `<div class="empty-list">${state.query ? 'No chats match your search.' : 'No chats yet.'}</div>`;
    return;
  }
  let last = null;
  for (const c of state.chats) {
    if (!state.query) {
      const g = groupLabel(c.updated_at);
      if (g !== last) { list.insertAdjacentHTML('beforeend', `<div class="group-label">${g}</div>`); last = g; }
    }
    const el = document.createElement('div');
    el.className = 'chat-item' + (state.chat && state.chat.id === c.id ? ' active' : '');
    el.innerHTML = `<div class="ci-main"><div class="ci-title">${highlight(c.title, state.query)}</div>` +
      (c.snippet ? `<div class="ci-snip">${highlight(c.snippet.replace(/\s+/g, ' '), state.query)}</div>` : '') +
      `</div><button class="ci-del" title="Delete chat">×</button>`;
    el.onclick = () => openChat(c.id);
    $('.ci-del', el).onclick = async e => { e.stopPropagation(); await deleteChat(c); };
    list.appendChild(el);
  }
}

async function loadChats() {
  try {
    const q = state.query ? '?q=' + encodeURIComponent(state.query) : '';
    state.chats = (await api('/api/chats' + q)).chats;
    if (state.chat && state.chat.id) {
      const hit = state.chats.find(c => c.id === state.chat.id);
      if (hit && hit.title !== state.chat.title) { state.chat.title = hit.title; $('#title').textContent = hit.title; }
    }
    renderSidebar();
  } catch (e) { showBanner(e.message); }
}

/* ---------------- Chat actions ---------------- */
function stopStream() { if (state.ctrl) state.ctrl.abort(); }

function newChat() {
  stopStream();
  state.chat = { id: null, title: 'New chat', model: null, system_prompt: '', num_ctx: null, think: 1, messages: [] };
  renderHeader(); renderMessages(); renderSidebar();
  $('#input').focus();
}

async function openChat(id) {
  if (state.chat && state.chat.id === id) return;
  stopStream();
  try {
    state.chat = await api('/api/chats/' + id);
    renderHeader(); renderMessages(); renderSidebar();
  } catch (e) { showBanner(e.message); }
}

async function deleteChat(c) {
  if (!confirm(`Delete "${c.title}"? This can't be undone.`)) return;
  await api('/api/chats/' + c.id, { method: 'DELETE' });
  if (state.chat && state.chat.id === c.id) newChat();
  await loadChats();
}

async function renameChat() {
  if (!state.chat.id) return;
  const t = prompt('Rename chat', state.chat.title);
  if (!t || !t.trim()) return;
  await api('/api/chats/' + state.chat.id, { method: 'PATCH', body: JSON.stringify({ title: t }) });
  state.chat.title = t.trim();
  $('#title').textContent = state.chat.title;
  await loadChats();
}

function setBusy(b) {
  state.busy = b;
  const btn = $('#send');
  btn.textContent = b ? 'Stop' : 'Send';
  btn.classList.toggle('stop', b);
}

async function send() {
  if (state.busy) { stopStream(); return; }
  const input = $('#input');
  const text = input.value.trim();
  if (!text) return;
  const model = $('#modelSel').value;
  if (!model) { showBanner('No model available. Is Ollama running and do you have a model pulled?'); return; }
  showBanner('');

  const chat = state.chat;
  const isFirst = chat.messages.length === 0;
  try {
    if (!chat.id) {
      const created = await api('/api/chats', {
        method: 'POST', body: JSON.stringify({ model, system_prompt: $('#sysPrompt').value, num_ctx: chat.num_ctx, think: chat.think }),
      });
      chat.id = created.id; chat.title = created.title;
    }
  } catch (e) { showBanner(e.message); return; }

  chat.model = model;
  localStorage.setItem('lastModel', model);
  chat.messages.push({ role: 'user', content: text });
  const reply = { role: 'assistant', content: '', thinking: '', model };
  chat.messages.push(reply);
  input.value = ''; autoGrow();
  setBusy(true);
  renderMessages();
  const replyEl = $('#msgWrap').lastElementChild;

  state.ctrl = new AbortController();
  let pending = false;
  const paint = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      if (state.chat !== chat) return;
      const stick = nearBottom();
      fillAssistant(replyEl, reply);
      if (stick) scrollBottom();
    });
  };

  try {
    const resp = await fetch(`/api/chats/${chat.id}/messages`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text, model, num_ctx: chat.num_ctx, think: chat.think }), signal: state.ctrl.signal,
    });
    if (!resp.ok) {
      let msg = resp.statusText;
      try { msg = (await resp.json()).error || msg; } catch {}
      throw new Error(msg);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const obj = JSON.parse(line);
        if (obj.th) { reply.thinking += obj.th; if (reply._t0 == null) reply._t0 = performance.now(); }
        if (obj.t) {
          if (reply._t0 != null && reply.think_ms == null) reply.think_ms = performance.now() - reply._t0;
          reply.content += obj.t;
        }
        if (obj.error) reply.error = obj.error;
        paint();
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') reply.error = e.message;
  } finally {
    setBusy(false);
    state.ctrl = null;
    if (state.chat === chat) {
      if (!reply.content && !reply.thinking && !reply.error) chat.messages.pop();  // stopped before any output
      renderMessages();
    }
    await loadChats();
    if (isFirst && reply.content) autoTitle(chat.id);  // not awaited: you can keep chatting
  }
}

// Ask the backend to have the model write a short title (see /title in app.py).
async function autoTitle(id) {
  try {
    await api('/api/chats/' + id + '/title', { method: 'POST' });
    await loadChats();  // refreshes the sidebar and the header title
  } catch (e) { /* keep the fallback title (first words of your message) */ }
}

/* ---------------- Wiring ---------------- */
function autoGrow() {
  const t = $('#input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 220) + 'px';
}

$('#newChat').onclick = newChat;
$('#send').onclick = send;
$('#title').onclick = renameChat;
$('#input').addEventListener('input', autoGrow);
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$('#sysToggle').onclick = () => $('#sysWrap').classList.toggle('open');
$('#sysPrompt').addEventListener('change', async () => {
  state.chat.system_prompt = $('#sysPrompt').value;
  if (state.chat.id) await api('/api/chats/' + state.chat.id, { method: 'PATCH', body: JSON.stringify({ system_prompt: state.chat.system_prompt }) });
});
$('#modelSel').addEventListener('change', async () => {
  state.chat.model = $('#modelSel').value;
  updateContextControls();
  localStorage.setItem('lastModel', state.chat.model);
  if (state.chat.id) await api('/api/chats/' + state.chat.id, { method: 'PATCH', body: JSON.stringify({ model: state.chat.model }) });
  if (!state.chat.messages.length) renderMessages();
});
let searchTimer;
$('#search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.query = e.target.value.trim(); loadChats(); }, 200);
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#search').focus(); }
});


/* ---------------- Model manager ---------------- */
const fmtSize = b => !b ? '-' : b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.round(b / 1e6) + ' MB';
const modelsDlg = $('#modelsDlg');

async function refreshModels() {
  try {
    state.models = (await api('/api/models')).models;
    for (const k in modelInfo) delete modelInfo[k];   // models may have changed
    syncModelSelect();
    if (state.models.length) showBanner('');
  } catch (e) { showBanner(e.message); }
}

async function renderModelTable() {
  const box = $('#modelTable');
  try {
    const { models } = await api('/api/models/details');
    if (!models.length) { box.innerHTML = '<div class="empty-list">No models downloaded yet.</div>'; return; }
    box.innerHTML = '<table><thead><tr><th>Model</th><th>Size</th><th>Parameters</th><th>Quant.</th><th></th></tr></thead><tbody>' +
      models.map(m => {
        const n = esc(m.name);
        return `<tr><td><span class="mname">${n}</span>${m.loaded ? '<span class="badge">in memory</span>' : ''}</td>` +
          `<td>${fmtSize(m.size)}</td><td>${esc(m.parameter_size || '-')}</td><td>${esc(m.quantization || '-')}</td>` +
          `<td class="act">${m.loaded ? `<button class="btn sm" data-act="unload" data-name="${n}">Unload</button>` : ''}` +
          `<button class="btn sm danger" data-act="delete" data-name="${n}">Delete</button></td></tr>`;
      }).join('') + '</tbody></table>';
  } catch (e) { box.innerHTML = '<div class="empty-list">' + esc(e.message) + '</div>'; }
}

$('#modelTable').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const name = b.dataset.name;
  try {
    if (b.dataset.act === 'delete') {
      if (!confirm('Delete "' + name + '" from disk?\nYou would have to download it again.')) return;
      await api('/api/models', { method: 'DELETE', body: JSON.stringify({ name }) });
      await refreshModels();
    } else {
      await api('/api/models/unload', { method: 'POST', body: JSON.stringify({ name }) });
    }
  } catch (err) { alert(err.message); }
  renderModelTable();
});

let pullCtrl = null;
async function pullModel() {
  if (pullCtrl) { pullCtrl.abort(); return; }   // button doubles as Cancel
  const name = $('#pullName').value.trim();
  if (!name) return;
  const btn = $('#pullBtn'), text = $('#pullText'), fill = $('#pbarFill');
  pullCtrl = new AbortController();
  btn.textContent = 'Cancel';
  $('#pullStatus').hidden = false;
  text.className = ''; text.textContent = 'Starting...'; fill.style.width = '0';
  let ok = false;
  try {
    const resp = await fetch('/api/models/pull', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }), signal: pullCtrl.signal,
    });
    if (!resp.ok) { let m = resp.statusText; try { m = (await resp.json()).error || m; } catch {} throw new Error(m); }
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const o = JSON.parse(line);
        if (o.error) throw new Error(o.error);
        if (o.total && o.completed != null) {
          const pct = Math.min(100, Math.round(o.completed / o.total * 100));
          fill.style.width = pct + '%';
          text.textContent = o.status + ' - ' + fmtSize(o.completed) + ' / ' + fmtSize(o.total) + ' (' + pct + '%)';
        } else {
          text.textContent = o.status;
        }
        if (o.status === 'success') ok = true;
      }
    }
    if (!ok) throw new Error('Download ended before finishing');
  } catch (e) {
    if (e.name === 'AbortError') text.textContent = 'Cancelled. Download again to resume.';
    else { text.className = 'bad'; text.textContent = 'Error: ' + e.message; }
  } finally {
    pullCtrl = null;
    btn.textContent = 'Download';
    if (ok) { fill.style.width = '100%'; text.textContent = 'Downloaded ' + name; $('#pullName').value = ''; }
    await refreshModels();
    renderModelTable();
  }
}

$('#modelsBtn').onclick = () => { modelsDlg.showModal(); renderModelTable(); loadLibrary(); };
$('#dlgClose').onclick = () => modelsDlg.close();
modelsDlg.addEventListener('click', e => { if (e.target === modelsDlg) modelsDlg.close(); });  // click on the backdrop
$('#pullBtn').onclick = pullModel;
$('#pullName').addEventListener('keydown', e => { if (e.key === 'Enter') pullModel(); });


/* ---------------- Browse the Ollama library ---------------- */
let library = null, libLoading = false;

async function loadLibrary() {
  if (library || libLoading) return;
  libLoading = true;
  const sel = $('#libModel');
  $('#libNote').textContent = '';
  try {
    library = (await api('/api/library')).models;
    library.forEach((m, i) => {
      const nums = m.sizes.map(parseParams).filter(n => n != null);
      m._idx = i;
      m._min = nums.length ? Math.min(...nums) : null;
      m._max = nums.length ? Math.max(...nums) : null;
    });
    const caps = {};
    library.forEach(m => m.capabilities.forEach(c => caps[c] = (caps[c] || 0) + 1));
    $('#libCap').innerHTML = '<option value="">Any capability</option>' +
      Object.keys(caps).sort().map(c => `<option value="${esc(c)}">${esc(c)} (${caps[c]})</option>`).join('');
    try { const sv = localStorage.getItem('libSort'); if (sv) $('#libSort').value = sv; } catch {}
    for (const id of ['#libSearch', '#libCap', '#libSize', '#libSort']) $(id).disabled = false;
    sel.disabled = false;
    renderLibraryOptions();
  } catch (e) {
    sel.innerHTML = '<option value="">Library unavailable - type a model name below</option>';
    $('#libNote').textContent = e.message;
  } finally { libLoading = false; }
}


// "1.5b" -> 1.5, "270m" -> 0.27 (billions of parameters); "e2b" -> 2
function parseParams(t) {
  const m = /(\d+(?:\.\d+)?)\s*([bmk])?/i.exec(t || '');
  return m ? parseFloat(m[1]) * ({ b: 1, m: 1e-3, k: 1e-6 }[(m[2] || 'b').toLowerCase()]) : null;
}

function renderLibraryOptions() {
  if (!library) return;
  const q = $('#libSearch').value.trim().toLowerCase();
  const cap = $('#libCap').value, maxB = parseFloat($('#libSize').value) || 0, sort = $('#libSort').value;
  const list = library.filter(m =>
    (!q || m.name.toLowerCase().includes(q) || (m.description || '').toLowerCase().includes(q)) &&
    (!cap || m.capabilities.includes(cap)) &&
    (!maxB || (m._min != null && m._min <= maxB)));          // models without size info are hidden when filtering by size
  if (sort === 'az') list.sort((a, b) => a.name.localeCompare(b.name));
  else if (sort === 'small') list.sort((a, b) => (a._min ?? 1e9) - (b._min ?? 1e9) || a._idx - b._idx);
  else if (sort === 'large') list.sort((a, b) => (b._max ?? -1) - (a._max ?? -1) || a._idx - b._idx);
  // 'popular' keeps the order ollama.com lists them in

  const sel = $('#libModel'), keep = sel.value;
  const head = list.length === library.length
    ? 'Browse the Ollama library (' + library.length + ' models)...'
    : (list.length ? list.length + ' of ' + library.length + ' models match - choose one...' : 'No model matches these filters');
  sel.innerHTML = '<option value="">' + head + '</option>' + list.map(m => {
    const extra = [m.sizes.join(', '), m.capabilities.join(', ')].filter(Boolean).join(' · ');
    return `<option value="${esc(m.name)}" title="${esc(m.description || '')}">${esc(m.name)}${extra ? ' - ' + esc(extra) : ''}</option>`;
  }).join('');
  if (list.some(m => m.name === keep)) sel.value = keep;
  else { $('#libTag').innerHTML = '<option value="">Variant</option>'; $('#libTag').disabled = true; }
}

for (const id of ['#libSearch', '#libCap', '#libSize', '#libSort']) {
  $(id).addEventListener(id === '#libSearch' ? 'input' : 'change', () => {
    if (id === '#libSort') { try { localStorage.setItem('libSort', $('#libSort').value); } catch {} }
    renderLibraryOptions();
  });
}

$('#libModel').addEventListener('change', async e => {
  const name = e.target.value, tagSel = $('#libTag');
  tagSel.disabled = true;
  $('#libNote').textContent = '';
  if (!name) { tagSel.innerHTML = '<option value="">Variant</option>'; return; }
  $('#pullName').value = name;                       // downloads the default variant if you stop here
  tagSel.innerHTML = '<option value="">Loading variants...</option>';
  try {
    const { tags, cloud_only } = await api('/api/library/' + encodeURIComponent(name) + '/tags');
    if ($('#libModel').value !== name) return;       // you picked another model meanwhile
    if (cloud_only) {
      tagSel.innerHTML = '<option value="">Cloud-only - nothing to download</option>';
      $('#pullName').value = '';
      $('#libNote').textContent = name + ' runs on Ollama\'s servers instead of your computer, so there is no local download.';
      return;
    }
    const installed = new Set(state.models);
    tagSel.innerHTML = '<option value="">Choose a variant (download size)...</option>' + tags.map(t =>
      `<option value="${esc(t.tag)}">${esc(t.tag)}${t.size ? ' - ' + esc(t.size) : ''}${installed.has(name + ':' + t.tag) ? '  (installed)' : ''}</option>`
    ).join('');
    tagSel.disabled = false;
  } catch (err) {
    tagSel.innerHTML = '<option value="">Variants unavailable</option>';
    $('#libNote').textContent = err.message;
  }
});

$('#libTag').addEventListener('change', e => {
  if (e.target.value) $('#pullName').value = $('#libModel').value + ':' + e.target.value;
});


/* ---------------- Context size + thinking toggle ---------------- */
const modelInfo = {};
const fmtCtx = n => n >= 1048576 ? +(n / 1048576).toFixed(1) + 'M' : +(n / 1024).toFixed(1) + 'k';
const fmtBytes = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.round(b / 1e6) + ' MB';

async function loadModelInfo(name) {
  if (!name) return null;
  if (modelInfo[name]) return modelInfo[name];
  try { return (modelInfo[name] = await api('/api/models/info?name=' + encodeURIComponent(name))); }
  catch { return null; }   // not installed / old Ollama: no context control, Ollama's own default applies
}

async function updateContextControls() {
  const name = $('#modelSel').value, sel = $('#ctxSel'), tw = $('#thinkWrap');
  if (!name || !state.chat) { sel.hidden = tw.hidden = true; return; }
  const info = await loadModelInfo(name);
  if ($('#modelSel').value !== name) return;             // you switched models meanwhile
  tw.hidden = !(info && info.thinking);
  $('#thinkChk').checked = state.chat.think !== 0 && state.chat.think !== false;
  if (!info || !info.steps || !info.steps.length) { sel.hidden = true; return; }
  const kv = info.kv_bytes_per_token;
  const cost = n => kv ? ' (~' + fmtBytes(kv * n) + ' cache)' : '';
  sel.innerHTML = '<option value="">Context: auto ' + fmtCtx(info.recommended_context) + cost(info.recommended_context) + '</option>' +
    info.steps.map(n => `<option value="${n}">${fmtCtx(n)}${cost(n)}${n === info.max_context ? ' (model max)' : ''}</option>`).join('');
  if (state.chat.num_ctx && !info.steps.includes(state.chat.num_ctx)) {   // saved size doesn't fit this model: back to auto
    state.chat.num_ctx = null;
    if (state.chat.id) api('/api/chats/' + state.chat.id, { method: 'PATCH', body: JSON.stringify({ num_ctx: null }) }).catch(() => {});
  }
  sel.value = state.chat.num_ctx ? String(state.chat.num_ctx) : '';
  sel.hidden = false;
}

$('#ctxSel').addEventListener('change', async () => {
  const v = $('#ctxSel').value;
  state.chat.num_ctx = v ? parseInt(v, 10) : null;
  if (state.chat.id) await api('/api/chats/' + state.chat.id, { method: 'PATCH', body: JSON.stringify({ num_ctx: state.chat.num_ctx }) });
});
$('#thinkChk').addEventListener('change', async () => {
  state.chat.think = $('#thinkChk').checked ? 1 : 0;
  if (state.chat.id) await api('/api/chats/' + state.chat.id, { method: 'PATCH', body: JSON.stringify({ think: state.chat.think }) });
});

(async function init() {
  try { state.models = (await api('/api/models')).models; }
  catch (e) { showBanner(e.message); }
  if (!state.models.length && !$('#banner').classList.contains('show')) {
    showBanner('Ollama is running but has no models. Pull one first, e.g. "ollama pull llama3.2".');
  }
  newChat();
  await loadChats();
})();
</script>
